spring.application.name=invoice-extractor
server.port=8080

# LangChain4j Configuration

# Default to Ollama (Mistral)
# To use Gemini, comment out Ollama and uncomment Gemini, or set via env vars.

# Ollama Configuration
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=mistral
langchain4j.ollama.chat-model.temperature=0.0

# Gemini Configuration (Example - requires API Key)
# langchain4j.google-ai-gemini.chat-model.api-key=${GEMINI_API_KEY}
# langchain4j.google-ai-gemini.chat-model.model-name=gemini-pro
# langchain4j.google-ai-gemini.chat-model.temperature=0.0

# To disable Ollama when using Gemini, we might need to be careful with auto-configuration.
# LangChain4j starters are aggressive.
# Usually, setting the property enables the bean.
# If both are dependencies, we might have issues if we don't handle conditions.
# For now, I'll rely on the user setting one or the other in a real scenario,
# or I can use Spring Profiles.

# Let's use profiles.
# Activates ollama by default.
spring.profiles.active=ollama
